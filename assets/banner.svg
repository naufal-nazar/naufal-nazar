<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Noufal Nazar — Software Engineer building low-latency trading systems and automation">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .line { stroke-dasharray: 900; animation: draw 3.5s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
      .tick { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .tick { animation: none; } .line { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0b1018"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity="0.55"/>

  <!-- progress bar, like the reels -->
  <rect x="40" y="28" width="1120" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="40" y="28" width="300" height="3" rx="1.5" fill="url(#bar)"/>

  <!-- window chrome -->
  <circle cx="56" cy="64" r="6" fill="#ff5f57"/>
  <circle cx="76" cy="64" r="6" fill="#febc2e"/>
  <circle cx="96" cy="64" r="6" fill="#28c840"/>
  <text x="124" y="69" class="mono" font-size="13" fill="#64748b">~/noufal-nazar — zsh</text>

  <!-- left: identity -->
  <text x="56" y="150" class="mono" font-size="16" fill="#2dd4bf">$ whoami</text>
  <text x="56" y="206" class="sans" font-size="52" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Noufal Nazar</text>
  <text x="56" y="246" class="mono" font-size="18" fill="#94a3b8">Software Engineer · low-latency trading systems</text>
  <text x="56" y="274" class="mono" font-size="18" fill="#94a3b8">&amp; automation that runs itself<tspan class="cursor" fill="#2dd4bf" font-weight="700">_</tspan></text>


  <!-- right: live market panel -->
  <g transform="translate(720 96)">
    <rect width="424" height="196" rx="12" fill="#0f1623" stroke="#1e293b"/>
    <circle cx="20" cy="22" r="4" fill="#2dd4bf" class="tick"/>
    <text x="32" y="26" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1">LIVE · NSE / BINANCE FEED</text>
    <text x="404" y="26" text-anchor="end" class="mono" font-size="11" fill="#475569">unattended · 24×7</text>

    <path d="M20 150 L60 138 L92 144 L124 118 L156 124 L188 96 L220 104 L252 80 L284 90 L316 64 L348 72 L380 52 L404 58 L404 176 L20 176 Z" fill="url(#fade)"/>
    <path class="line" d="M20 150 L60 138 L92 144 L124 118 L156 124 L188 96 L220 104 L252 80 L284 90 L316 64 L348 72 L380 52 L404 58" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linejoin="round"/>

    <g class="mono" font-size="11">
      <text x="20" y="190" fill="#475569">ingest</text>
      <text x="92" y="190" fill="#334155">→</text>
      <text x="112" y="190" fill="#475569">signal</text>
      <text x="184" y="190" fill="#334155">→</text>
      <text x="204" y="190" fill="#475569">risk</text>
      <text x="252" y="190" fill="#334155">→</text>
      <text x="272" y="190" fill="#2dd4bf">execute ✓</text>
    </g>
  </g>
</svg>
